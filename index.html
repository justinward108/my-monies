<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Monies — personal cash-flow tracker</title>
<style>
  :root {
    --bg: #14171c; --surface: #1b1f26; --surface2: #12151a;
    --border: #262b33; --border2: #2c323c; --text: #e6e8eb;
    --muted: #8b94a3; --hint: #6b7280; --green: #4fb477;
    --amber: #e0a458; --red: #d9636c; --focus: #6c8bd9;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "SFMono-Regular", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); padding-bottom: 60px; }
  input, select, button { font-family: inherit; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #333a44; border-radius: 4px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; padding: 20px 20px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
  .logo { font-family: var(--font-mono); font-size: 20px; letter-spacing: 3px; font-weight: 700; }
  .logo-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .balance-badge { text-align: right; }
  .zoom-controls { display: flex; align-items: center; gap: 6px; }
  .zoom-btn {
    background: var(--surface2); border: 1px solid var(--border2); color: var(--text);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; font-family: var(--font-mono);
  }
  .zoom-btn:hover { background: #191d24; }
  .zoom-label { font-size: 11px; color: var(--muted); min-width: 34px; text-align: center; }
  .balance-label { font-size: 10px; color: var(--muted); }
  .balance-num { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }

  nav.tabs { display: flex; gap: 4px; padding: 12px 16px 0; overflow-x: auto; }
  nav.tabs button { background: transparent; border: none; color: var(--muted); padding: 8px 14px; font-size: 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  nav.tabs button.active { background: #1f242c; color: var(--text); font-weight: 600; }

  main { padding: 16px; max-width: min(1100px, 96vw); margin: 0 auto; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow-x: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } .grid3 { grid-template-columns: 1fr; } }
  @media (min-width: 481px) and (max-width: 720px) { .grid3 { grid-template-columns: 1fr 1fr; } }

  .card-title { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #a7afba; margin-bottom: 10px; font-weight: 600; }
  .card-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .big-num { font-family: var(--font-mono); font-size: 26px; font-weight: 700; }
  .hint { font-size: 11px; color: var(--hint); margin-top: 4px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .field-wrap { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 11px; color: var(--muted); }

  .input-inline { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: var(--font-mono); }
  .add-btn { display: inline-flex; align-items: center; gap: 4px; background: #242a33; border: 1px solid #333a44; color: var(--text); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .add-btn:hover { background: #2a313c; }
  .primary-btn { background: #2f5fb0; border: 1px solid #3a6fc4; color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .primary-btn:hover { background: #366bc4; }

  .item-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #232830; flex-wrap: wrap; }
  .input-flex { flex: 1; min-width: 100px; background: transparent; border: none; color: var(--text); font-size: 13px; padding: 4px 0; font-weight: 600; }
  .input-small { width: 84px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 6px; font-size: 13px; font-family: var(--font-mono); color: var(--text); }
  .day-wrap { display: flex; align-items: center; gap: 4px; }
  .input-day { width: 44px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 6px; font-size: 13px; color: var(--text); font-family: var(--font-mono); }
  select.acct-select { background: var(--surface2); border: 1px solid var(--border2); color: #a7afba; border-radius: 6px; padding: 4px 6px; font-size: 12px; max-width: 160px; }
  select.freq-select { background: var(--surface2); border: 1px solid var(--border2); color: #a7afba; border-radius: 6px; padding: 4px 6px; font-size: 12px; max-width: 130px; }
  select.type-select { background: var(--surface2); border: 1px solid var(--border2); color: #a7afba; border-radius: 6px; padding: 4px 6px; font-size: 12px; max-width: 90px; }
  .delete-btn { background: transparent; border: none; color: var(--hint); cursor: pointer; padding: 4px; display: flex; align-items: center; }
  .delete-btn:hover { color: var(--red); }

  .freq-fields { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .account-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #232830; flex-wrap: wrap; }
  .account-row-name { font-size: 14px; font-weight: 600; }
  .account-row-nums { text-align: right; min-width: 90px; }

  .upcoming-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #232830; }
  .upcoming-label { font-size: 13px; font-weight: 600; }
  .upcoming-meta { font-size: 11px; color: var(--hint); }
  .upcoming-amt { font-family: var(--font-mono); font-weight: 700; }

  .toggle-row { display: flex; gap: 6px; }
  .toggle-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .toggle-btn.active { background: #242a33; color: var(--text); font-weight: 600; }

  .history-header, .history-row { display: flex; font-size: 13px; }
  .history-header { font-size: 11px; color: var(--hint); padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .history-row { padding: 8px 0; border-bottom: 1px solid #1f242c; }
  .hist-col { width: 110px; text-align: right; font-family: var(--font-mono); }
  .hist-name { flex: 1; }

  .result-box { margin-top: 14px; padding: 14px; border-radius: 10px; border: 1px solid; }
  .warn-box { padding: 10px 12px; border-radius: 8px; border: 1px solid #e0a45855; background: #e0a45812; margin-top: 8px; font-size: 12.5px; }
  .ok-box { padding: 10px 12px; border-radius: 8px; border: 1px solid #4fb47755; background: #4fb47712; margin-top: 8px; font-size: 12.5px; }

  .icon { display: inline-block; width: 15px; height: 15px; vertical-align: -3px; }
  .backup-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .backup-btn { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer; }
  .backup-btn:hover { background: #191d24; }
  #importFile { display: none; }
  label.checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">MY MONIES</div>
    <div class="logo-sub">personal cash-flow tracker</div>
  </div>
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomOutBtn" title="Smaller text">A−</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="zoom-btn" id="zoomInBtn" title="Bigger text">A+</button>
  </div>
  <div class="balance-badge">
    <div class="balance-label" id="balanceLabel">combined, as of —</div>
    <div class="balance-num" id="balanceNum">$0.00</div>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main><div id="tabContent"></div></main>
<input type="file" id="importFile" accept="application/json" />

<script>
// ================= helpers =================
const uid = () => Math.random().toString(36).slice(2, 10);
const money = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => new Date().toISOString().slice(0, 10);
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function dateForDay(y, m, day) { const d = Math.min(day, daysInMonth(y, m)); return new Date(y, m, d); }
function daysUntil(dateStr) {
  const now = new Date(); now.setHours(0,0,0,0);
  const t = new Date(dateStr); t.setHours(0,0,0,0);
  return Math.round((t - now) / 86400000);
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

// ---------- password-based encryption for backups ----------
function bufToBase64(buf) {
  let binary = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function base64ToBuf(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}
async function encryptBackup(plainObj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(plainObj)));
  return { myMoniesEncrypted: true, salt: bufToBase64(salt), iv: bufToBase64(iv), ciphertext: bufToBase64(ciphertext) };
}
async function decryptBackup(encObj, password) {
  const salt = new Uint8Array(base64ToBuf(encObj.salt));
  const iv = new Uint8Array(base64ToBuf(encObj.iv));
  const key = await deriveKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, base64ToBuf(encObj.ciphertext));
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

function fmtDate(d) { return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); }

// ---- US federal holidays + weekend adjustment ----
function nthWeekday(year, month, weekday, n) {
  if (n > 0) {
    let d = new Date(year, month, 1);
    let count = 0;
    while (true) {
      if (d.getDay() === weekday) { count++; if (count === n) return new Date(d); }
      d.setDate(d.getDate() + 1);
    }
  } else {
    let d = new Date(year, month + 1, 0);
    while (d.getDay() !== weekday) d.setDate(d.getDate() - 1);
    return new Date(d);
  }
}
function observedDate(date) {
  const dow = date.getDay();
  if (dow === 6) { const d = new Date(date); d.setDate(d.getDate() - 1); return d; }
  if (dow === 0) { const d = new Date(date); d.setDate(d.getDate() + 1); return d; }
  return date;
}
function getUSFederalHolidays(year) {
  const list = [
    new Date(year, 0, 1), nthWeekday(year, 0, 1, 3), nthWeekday(year, 1, 1, 3),
    nthWeekday(year, 4, 1, -1), new Date(year, 5, 19), new Date(year, 6, 4),
    nthWeekday(year, 8, 1, 1), nthWeekday(year, 9, 1, 2), new Date(year, 10, 11),
    nthWeekday(year, 10, 4, 4), new Date(year, 11, 25),
  ];
  const set = new Set();
  list.forEach(d => set.add(observedDate(d).toISOString().slice(0, 10)));
  return set;
}
const holidayCache = {};
function isHoliday(date) {
  const y = date.getFullYear();
  if (!holidayCache[y]) holidayCache[y] = getUSFederalHolidays(y);
  return holidayCache[y].has(date.toISOString().slice(0, 10));
}
function isWeekend(date) { const d = date.getDay(); return d === 0 || d === 6; }
function isBusinessDay(date) { return !isWeekend(date) && !isHoliday(date); }
function adjustDate(date, mode) {
  if (mode !== "earlier" && mode !== "later") return date;
  let d = new Date(date);
  const step = mode === "earlier" ? -1 : 1;
  while (!isBusinessDay(d)) d.setDate(d.getDate() + step);
  return d;
}

const FREQ_LABELS = { monthly: "Monthly", semimonthly: "Twice a month", biweekly: "Every 2 weeks", every30days: "Every 30 days" };

function freshRecurringItem(accountId) {
  return {
    id: uid(), name: "New item", amount: 0, accountId, frequency: "monthly",
    dayOfMonth: 1, daysOfMonth: [1, 15], anchorDate: todayISO(),
    temporary: false, endMode: "count", occurrenceCount: 4, endDate: todayISO(),
    businessDayAdjust: "none", exceptions: [], downPayment: null, categoryId: null,
  };
}

const DEFAULT_DATA = {
  startingDate: todayISO(),
  accounts: [{ id: uid(), name: "Checking", balance: 0, type: "asset", interestRate: 0, interestDay: 1 }],
  income: [],
  recurring: [],
  oneTime: [],
  scenario: [],
  transfers: [],
  categories: [],
};

function freshTransferItem(fromAccountId, toAccountId) {
  return {
    id: uid(), name: "Transfer", amount: 0, fee: 0, fromAccountId, toAccountId, frequency: "once",
    dayOfMonth: 1, daysOfMonth: [1, 15], anchorDate: todayISO(),
    temporary: false, endMode: "count", occurrenceCount: 4, endDate: todayISO(),
    businessDayAdjust: "none", exceptions: [], downPayment: null,
  };
}

const STORAGE_KEY = "ledger-budget-data";

// ================= storage =================
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      migrate(parsed);
      return parsed;
    }
  } catch (e) { console.error("load error", e); }
  return structuredClone(DEFAULT_DATA);
}
function migrate(d) {
  if (!d.scenario) d.scenario = [];
  if (!d.transfers) d.transfers = [];
  if (!d.categories) d.categories = [];
  (d.accounts || []).forEach(a => {
    if (!a.type) a.type = "asset";
    if (a.interestRate === undefined) a.interestRate = 0;
    if (!a.interestDay) a.interestDay = 1;
  });
  [...(d.income||[]), ...(d.recurring||[]), ...(d.transfers||[])].forEach(item => {
    if (!item.frequency) item.frequency = "monthly";
    if (item.dayOfMonth === undefined) item.dayOfMonth = 1;
    if (!item.daysOfMonth) item.daysOfMonth = [1, 15];
    if (!item.anchorDate) item.anchorDate = todayISO();
    if (item.temporary === undefined) item.temporary = false;
    if (!item.endMode) item.endMode = "count";
    if (item.occurrenceCount === undefined) item.occurrenceCount = 4;
    if (!item.endDate) item.endDate = todayISO();
    if (!item.businessDayAdjust) item.businessDayAdjust = "none";
    if (!item.exceptions) item.exceptions = [];
    if (item.downPayment === undefined) item.downPayment = null;
  });
  [...(d.income||[]), ...(d.recurring||[])].forEach(item => {
    if (item.categoryId === undefined) item.categoryId = null;
  });
  (d.transfers || []).forEach(item => { if (item.fee === undefined) item.fee = 0; });
  (d.oneTime||[]).forEach(item => {
    if (!item.type) item.type = "expense";
    if (!item.businessDayAdjust) item.businessDayAdjust = "none";
    if (item.categoryId === undefined) item.categoryId = null;
  });
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { console.error("save error", e); }
}

let data = loadData();
let tab = "Dashboard";

// ================= projection engine =================
function occurrencesInRange(item, rangeStart, rangeEnd) {
  const dates = [];
  const mode = item.businessDayAdjust || "none";
  if (item.frequency === "once") {
    const d = adjustDate(new Date(item.anchorDate), mode);
    if (d >= rangeStart && d <= rangeEnd) dates.push(d);
    return dates;
  }
  if (item.frequency === "biweekly" || item.frequency === "every30days") {
    const intervalDays = item.frequency === "biweekly" ? 14 : 30;
    let anchor = new Date(item.anchorDate || rangeStart);
    anchor.setHours(0,0,0,0);
    let d = new Date(anchor);
    if (d < rangeStart) {
      const diffDays = Math.round((rangeStart - d) / 86400000);
      const periods = Math.ceil(diffDays / intervalDays);
      d = new Date(d.getTime() + periods * intervalDays * 86400000);
    }
    while (d <= rangeEnd) {
      if (d >= rangeStart) dates.push(adjustDate(d, mode));
      d = new Date(d.getTime() + intervalDays * 86400000);
    }
  } else {
    const cursor = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
    const endCursor = new Date(rangeEnd.getFullYear(), rangeEnd.getMonth(), 1);
    while (cursor <= endCursor) {
      const y = cursor.getFullYear(), m = cursor.getMonth();
      if (item.frequency === "semimonthly") {
        (item.daysOfMonth || [1, 15]).forEach(day => {
          const d = dateForDay(y, m, day);
          if (d >= rangeStart && d <= rangeEnd) dates.push(adjustDate(d, mode));
        });
      } else {
        const d = dateForDay(y, m, item.dayOfMonth || 1);
        if (d >= rangeStart && d <= rangeEnd) dates.push(adjustDate(d, mode));
      }
      cursor.setMonth(cursor.getMonth() + 1);
    }
  }
  return dates;
}

function occurrencesWithLimits(item, rangeStart, rangeEnd) {
  let dates = occurrencesInRange(item, rangeStart, rangeEnd);
  if (!item.temporary) return dates;
  if (item.endMode === "date" && item.endDate) {
    const end = new Date(item.endDate);
    dates = dates.filter(d => d <= end);
  } else if (item.endMode === "count" && item.occurrenceCount) {
    const anchor = new Date(item.anchorDate || rangeStart);
    const fullSeries = occurrencesInRange(item, anchor < rangeStart ? anchor : rangeStart, rangeEnd);
    const limited = fullSeries.slice(0, item.occurrenceCount);
    const limitedSet = new Set(limited.map(d => d.getTime()));
    dates = dates.filter(d => limitedSet.has(d.getTime()));
  }
  return dates;
}

function applyExceptions(item, dates) {
  const excMap = new Map((item.exceptions || []).map(e => [e.originalDate, e]));
  const result = [];
  for (const d of dates) {
    const key = d.toISOString().slice(0, 10);
    const exc = excMap.get(key);
    if (exc) {
      if (exc.action === "skip") continue;
      if (exc.action === "amount") {
        result.push({ date: d, amount: (exc.newAmount !== null && exc.newAmount !== undefined && exc.newAmount !== "") ? parseFloat(exc.newAmount) : null });
        continue;
      }
      if (exc.action === "move") {
        result.push({ date: new Date(exc.newDate || key), amount: (exc.newAmount !== null && exc.newAmount !== undefined && exc.newAmount !== "") ? parseFloat(exc.newAmount) : null });
        continue;
      }
    }
    result.push({ date: d, amount: null });
  }
  return result;
}

function firstOccurrenceDate(item) {
  const anchor = new Date(item.anchorDate || data.startingDate);
  const farFuture = new Date(anchor);
  farFuture.setFullYear(farFuture.getFullYear() + 5);
  const series = occurrencesWithLimits(item, anchor, farFuture);
  return series.length ? series[0] : null;
}

function resolveAmounts(item, dates) {
  const afterExceptions = applyExceptions(item, dates);
  if (item.downPayment === null || item.downPayment === undefined || item.downPayment === "") return afterExceptions;
  const firstDate = firstOccurrenceDate(item);
  const firstKey = firstDate ? firstDate.toISOString().slice(0, 10) : null;
  return afterExceptions.map(o => {
    if (o.amount == null && firstKey && o.date.toISOString().slice(0, 10) === firstKey) {
      return { date: o.date, amount: parseFloat(item.downPayment) };
    }
    return o;
  });
}

function buildEvents(startDate, endDate) {
  const events = [];
  const accountName = (id) => data.accounts.find(a => a.id === id)?.name || "Unassigned";

  for (const item of data.oneTime) {
    const raw = new Date(item.date);
    const d = adjustDate(raw, item.businessDayAdjust || "none");
    if (d >= startDate && d <= endDate) {
      const sign = item.type === "income" ? 1 : -1;
      events.push({ date: d, amount: sign * Math.abs(item.amount), label: item.name, kind: item.type === "income" ? "one-time income" : "one-time expense", accountId: item.accountId, accountName: accountName(item.accountId), categoryId: item.categoryId || null });
    }
  }
  for (const exp of data.recurring) {
    resolveAmounts(exp, occurrencesWithLimits(exp, startDate, endDate)).forEach(o => {
      const amt = o.amount != null ? o.amount : exp.amount;
      events.push({ date: o.date, amount: -Math.abs(amt), label: exp.name, kind: "recurring expense", accountId: exp.accountId, accountName: accountName(exp.accountId), categoryId: exp.categoryId || null });
    });
  }
  for (const inc of data.income) {
    resolveAmounts(inc, occurrencesWithLimits(inc, startDate, endDate)).forEach(o => {
      const amt = o.amount != null ? o.amount : inc.amount;
      events.push({ date: o.date, amount: Math.abs(amt), label: inc.name, kind: "income", accountId: inc.accountId, accountName: accountName(inc.accountId), categoryId: inc.categoryId || null });
    });
  }
  for (const tr of data.transfers) {
    resolveAmounts(tr, occurrencesWithLimits(tr, startDate, endDate)).forEach(o => {
      const sentAmt = Math.abs(o.amount != null ? o.amount : tr.amount);
      const fee = Math.abs(tr.fee || 0);
      const receivedAmt = Math.max(0, sentAmt - fee);
      const fromName = accountName(tr.fromAccountId), toName = accountName(tr.toAccountId);
      events.push({ date: o.date, amount: -sentAmt, label: `${tr.name} → ${toName}`, kind: "transfer out", accountId: tr.fromAccountId, accountName: fromName, categoryId: null });
      events.push({ date: o.date, amount: receivedAmt, label: fee > 0 ? `${tr.name} ← ${fromName} (after fee)` : `${tr.name} ← ${fromName}`, kind: "transfer in", accountId: tr.toAccountId, accountName: toName, categoryId: null });
    });
  }
  events.sort((a, b) => a.date - b.date);
  return events;
}

function generateInterestDates(account, rangeStart, rangeEnd) {
  const dates = [];
  if (!account.interestRate) return dates;
  const day = account.interestDay || 1;
  const cursor = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
  const endCursor = new Date(rangeEnd.getFullYear(), rangeEnd.getMonth(), 1);
  while (cursor <= endCursor) {
    const d = dateForDay(cursor.getFullYear(), cursor.getMonth(), day);
    if (d > rangeStart && d <= rangeEnd) dates.push(d);
    cursor.setMonth(cursor.getMonth() + 1);
  }
  return dates;
}

function accountBalanceAt(account, targetDate) {
  const start = new Date(data.startingDate);
  if (targetDate < start) {
    // backward-in-time queries: simple reversal, interest not un-compounded (rare edge case)
    const events = buildEvents(targetDate, start).filter(e => e.accountId === account.id);
    let bal = account.balance;
    for (const e of events) { if (e.date > targetDate && e.date <= start) bal -= e.amount; }
    return bal;
  }
  const realEvents = buildEvents(start, targetDate)
    .filter(e => e.accountId === account.id)
    .map(e => ({ date: e.date, isInterest: false, amount: e.amount }));
  const interestEvents = generateInterestDates(account, start, targetDate).map(d => ({ date: d, isInterest: true }));
  const timeline = [...realEvents, ...interestEvents].sort((a, b) => a.date - b.date);
  let bal = account.balance;
  for (const e of timeline) {
    if (e.isInterest) bal += bal * ((account.interestRate || 0) / 100 / 12);
    else bal += e.amount;
  }
  return bal;
}
function balanceAt(targetDate, accountId = null) {
  if (accountId) {
    const acc = data.accounts.find(a => a.id === accountId);
    return acc ? accountBalanceAt(acc, targetDate) : 0;
  }
  // credit card balances are stored negative already, so a plain sum is the correct net worth
  return data.accounts.reduce((sum, a) => sum + accountBalanceAt(a, targetDate), 0);
}
function monthlyNet(accountId = null) {
  // approximate monthly-equivalent net regardless of underlying frequency
  const perMonth = (item) => {
    if (item.frequency === "biweekly") return Math.abs(item.amount) * (365.25 / 14 / 12);
    if (item.frequency === "semimonthly") return Math.abs(item.amount) * 2;
    return Math.abs(item.amount);
  };
  const inc = data.income.filter(i => !accountId || i.accountId === accountId).reduce((s, i) => s + perMonth(i), 0);
  const exp = data.recurring.filter(e => !accountId || e.accountId === accountId).reduce((s, e) => s + perMonth(e), 0);
  return inc - exp;
}

// scenario helpers
function scenarioEvents(accountId = null) {
  return data.scenario.filter(s => !accountId || s.accountId === accountId).map(s => ({
    date: new Date(s.date), amount: (s.type === "income" ? 1 : -1) * Math.abs(s.amount),
    label: s.name, kind: s.type === "income" ? "scenario income" : "scenario expense", accountId: s.accountId,
  }));
}

function projectAccountTimeline(account, extraEvents, horizonEnd) {
  const start = new Date(data.startingDate);
  let events = buildEvents(start, horizonEnd).filter(e => e.accountId === account.id);
  if (extraEvents && extraEvents.length) events = events.concat(extraEvents.filter(e => e.accountId === account.id));
  const realEvents = events.map(e => ({ date: e.date, isInterest: false, amount: e.amount }));
  const interestEvents = generateInterestDates(account, start, horizonEnd).map(d => ({ date: d, isInterest: true }));
  const timeline = [...realEvents, ...interestEvents].sort((a, b) => a.date - b.date);
  let bal = account.balance;
  let firstNegative = null;
  for (const e of timeline) {
    if (e.isInterest) bal += bal * ((account.interestRate || 0) / 100 / 12);
    else bal += e.amount;
    // credit card balances are stored negative already — going more negative isn't a new "shortfall"
    if (account.type !== "credit" && bal < 0 && !firstNegative) firstNegative = { date: e.date, balance: bal };
  }
  return { finalBalance: bal, firstNegative };
}

function findEarliestAffordableDate(amount, accountId, includeScenario, horizonDays = 730) {
  const today = new Date(); today.setHours(0,0,0,0);
  const horizonEnd = new Date(today); horizonEnd.setDate(horizonEnd.getDate() + horizonDays);
  let checkDate = new Date(today);
  while (checkDate <= horizonEnd) {
    let bal = balanceAt(checkDate, accountId);
    if (includeScenario) {
      bal += scenarioEvents(accountId).filter(e => e.date <= checkDate).reduce((s, e) => s + e.amount, 0);
    }
    if (bal >= amount) return checkDate;
    checkDate.setDate(checkDate.getDate() + 1);
  }
  return null;
}

function moveItem(arr, index, direction) {
  const target = index + direction;
  if (target < 0 || target >= arr.length) return;
  const tmp = arr[index];
  arr[index] = arr[target];
  arr[target] = tmp;
}

function sortAndFilterItems(items, sortMode, categoryFilter) {
  let list = categoryFilter && categoryFilter !== "ALL"
    ? items.filter(it => (categoryFilter === "NONE" ? !it.categoryId : it.categoryId === categoryFilter))
    : items.slice();
  const categoryName = (id) => data.categories.find(c => c.id === id)?.name || "";
  if (sortMode === "name") list.sort((a, b) => a.name.localeCompare(b.name));
  else if (sortMode === "amount-desc") list.sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount));
  else if (sortMode === "amount-asc") list.sort((a, b) => Math.abs(a.amount) - Math.abs(b.amount));
  else if (sortMode === "category") list.sort((a, b) => categoryName(a.categoryId).localeCompare(categoryName(b.categoryId)));
  return list;
}

function computeHistoryRows(mode, scope, categoryFilter) {
  const start = new Date(data.startingDate);
  const out = [];
  const accId = scope === "ALL" ? null : scope;
  const isTransfer = (e) => e.kind === "transfer in" || e.kind === "transfer out";
  const catOk = (e) => !categoryFilter || categoryFilter === "ALL" || (categoryFilter === "NONE" ? !e.categoryId : e.categoryId === categoryFilter);
  if (mode === "monthly") {
    let bal = balanceAt(start, accId);
    let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
    for (let i = 0; i < 12; i++) {
      const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);
      const allEvents = buildEvents(i===0?start:cursor, monthEnd).filter(e => !accId || e.accountId === accId);
      const events = allEvents.filter(catOk);
      const income = events.filter(e=>e.amount>0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const expense = events.filter(e=>e.amount<0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const transfers = events.filter(isTransfer).reduce((s,e)=>s+e.amount,0);
      // balance always reflects the true (unfiltered) running total; category filter only narrows what's displayed
      const allIncome = allEvents.filter(e=>e.amount>0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const allExpense = allEvents.filter(e=>e.amount<0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const allTransfers = allEvents.filter(isTransfer).reduce((s,e)=>s+e.amount,0);
      bal += allIncome + allExpense + allTransfers;
      out.push({ label: cursor.toLocaleString(undefined,{month:"long",year:"numeric"}), income, expense, transfers, end: bal, events: events.slice().sort((a,b)=>a.date-b.date) });
      cursor.setMonth(cursor.getMonth()+1);
    }
  } else {
    let bal = balanceAt(start, accId);
    let cursor = new Date(start.getFullYear(), 0, 1);
    for (let i = 0; i < 5; i++) {
      const yearEnd = new Date(cursor.getFullYear(), 11, 31);
      const allEvents = buildEvents(i===0?start:cursor, yearEnd).filter(e => !accId || e.accountId === accId);
      const events = allEvents.filter(catOk);
      const income = events.filter(e=>e.amount>0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const expense = events.filter(e=>e.amount<0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const transfers = events.filter(isTransfer).reduce((s,e)=>s+e.amount,0);
      const allIncome = allEvents.filter(e=>e.amount>0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const allExpense = allEvents.filter(e=>e.amount<0 && !isTransfer(e)).reduce((s,e)=>s+e.amount,0);
      const allTransfers = allEvents.filter(isTransfer).reduce((s,e)=>s+e.amount,0);
      bal += allIncome + allExpense + allTransfers;
      out.push({ label: String(cursor.getFullYear()), income, expense, transfers, end: bal, events: events.slice().sort((a,b)=>a.date-b.date) });
      cursor.setFullYear(cursor.getFullYear()+1);
    }
  }
  return out;
}

let historyExpandedIndex = null;

function csvEscape(val) {
  const s = String(val ?? "");
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function downloadCSV(filename, rows) {
  const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function exportHistorySummaryCSV() {

  const header = [[historyMode === "monthly" ? "Month" : "Year", "Income", "Expenses", "Transfers", "End Balance"]];
  const body = rows.map(r => [r.label, r.income.toFixed(2), r.expense.toFixed(2), r.transfers.toFixed(2), r.end.toFixed(2)]);
  downloadCSV(`my-monies-summary-${historyMode}-${scopeLabel}-${catLabel}-${todayISO()}.csv`.replace(/\s+/g, "_"), [...header, ...body]);

function attachHandlers() {
  if (tab === "Dashboard") {

  }

  if (tab === "Accounts") {
    document.getElementById("addAccountBtn").onclick = () => { data.accounts.push({ id: uid(), name: "New account", balance: 0, type: "asset", interestRate: 0, interestDay: 1 }); saveData(); render(); };
    document.querySelectorAll('[data-account-id]').forEach(row => {

      row.querySelector('.acct-name').onchange = e => { data.accounts.find(a=>a.id===id).name = e.target.value; saveData(); render(); };
      row.querySelector('.acct-balance').onchange = e => {
        const acc = data.accounts.find(a=>a.id===id);
        const v = parseFloat(e.target.value) || 0;
        acc.balance = acc.type === "credit" ? -Math.abs(v) : v;
        saveData(); render();
      };
      row.querySelector('.acct-type').onchange = e => {
        const acc = data.accounts.find(a=>a.id===id);
        const wasCredit = acc.type === "credit";
        const willBeCredit = e.target.value === "credit";
        acc.type = e.target.value;
        if (wasCredit !== willBeCredit) acc.balance = -acc.balance; // flip sign so the magnitude carries over sensibly
        saveData(); render();
      };
      row.querySelector('.acct-rate').onchange = e => { data.accounts.find(a=>a.id===id).interestRate = parseFloat(e.target.value) || 0; saveData(); render(); };
      const rateDay = row.querySelector('.acct-interestday');

      const upBtn = row.querySelector('.acct-moveup');

      const downBtn = row.querySelector('.acct-movedown');

      const delBtn = row.querySelector('.acct-delete');

        data.accounts = data.accounts.filter(a=>a.id!==id);

        data.income.forEach(i => { if (i.accountId === id) i.accountId = fallback; });
        data.recurring.forEach(r => { if (r.accountId === id) r.accountId = fallback; });
        data.oneTime.forEach(o => { if (o.accountId === id) o.accountId = fallback; });
        data.scenario.forEach(s => { if (s.accountId === id) s.accountId = fallback; });
        data.transfers.forEach(t => {
          if (t.fromAccountId === id) t.fromAccountId = fallback;
          if (t.toAccountId === id) t.toAccountId = fallback;
        });
        saveData(); render();
      };
    });
    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = `my-monies-backup-${todayISO()}.json`; a.click();
      URL.revokeObjectURL(url);
    };
    document.getElementById("exportEncryptedBtn").onclick = async () => {
      const password = prompt("Set a password to protect this backup. You'll need this exact password again to import it — there's no way to recover it if you forget.");
      if (!password) return;
      const confirmPassword = prompt("Confirm the password:");
      if (confirmPassword !== password) { alert("Those didn't match — nothing was exported. Try again."); return; }
      try {
        const encObj = await encryptBackup(data, password);
        const blob = new Blob([JSON.stringify(encObj)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = `my-monies-backup-encrypted-${todayISO()}.json`; a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Encryption failed: " + err.message);
      }
    };

  }

function moveOneTimeItem(id, direction) {
  const item = data.oneTime.find(x => x.id === id);
  if (!item) return;
  const sameType = data.oneTime.filter(x => x.type === item.type);
  const idxInSameType = sameType.indexOf(item);
  const targetIdxInSameType = idxInSameType + direction;
  if (targetIdxInSameType < 0 || targetIdxInSameType >= sameType.length) return;
  const targetItem = sameType[targetIdxInSameType];
  const fullIdxA = data.oneTime.indexOf(item);
  const fullIdxB = data.oneTime.indexOf(targetItem);
  const tmp = data.oneTime[fullIdxA];
  data.oneTime[fullIdxA] = data.oneTime[fullIdxB];
  data.oneTime[fullIdxB] = tmp;
}

    <div class="hint" style="font-size:13px;line-height:1.6;color:#c3c8d1">
      This app tracks your money across one or more accounts, projects your balance forward based on income and bills you enter,

    <div class="hint" style="font-size:13px;line-height:1.6;color:#c3c8d1">

      <strong>One-time transactions</strong> are things that happen once — under Income for one-time income
      (a gift, a reimbursement) and under Expenses for one-time expenses (a bill, a purchase).<br/><br/>
      <strong>Categories</strong> — shared between Income and Expenses (manage them from either tab). Assign a category to
      any item, then filter or sort by it. Archiving a category hides it from the picker for new entries without deleting
      it or breaking anything already using it.<br/><br/>
      <strong>Sort &amp; filter</strong> — each list has its own sort (custom order, name, amount, or category) and category
      filter. Reorder (the ▲▼ buttons) only shows up under "custom order" with no filter active — switch back to that
      combination any time to manually rearrange a list again.<br/><br/>
      <strong>Temporary / limited run</strong> — check this on a recurring item if it doesn't go on forever, like a
      Klarna "pay in 4": set it to every 2 weeks, mark it temporary, and choose "after 4 charges."<br/><br/>
      <strong>First payment is different</strong> — for financed purchases with a down payment (e.g. furniture financing:
      $200 down, then $50/month), check this and enter the down payment amount; every payment after the first uses the
      regular amount.<br/><br/>
      <strong>Weekends/holidays</strong> — if a charge or paycheck actually lands on the nearest business day instead of
      the exact date (common for direct deposits and bank transfers), set this to move earlier or later. It checks against
      real US federal holidays, not just weekends.<br/><br/>
      <strong>One-off adjustments</strong> — for a specific occurrence: "same date, actual amount" covers a bill that
      varies month to month (phone, electric — enter your ballpark as the regular amount, then adjust each month once you
      know the real charge), "moved to a different date" covers something that landed early or late, and "didn't happen"
      skips an occurrence entirely.
    </div>`);

  html += section("Transfers", `
    <div class="hint" style="font-size:13px;line-height:1.6;color:#c3c8d1">
      Move money between your own accounts — paying down a credit card, moving to savings, sending to Venmo or Cash App.
      Transfers don't count as income or spending, but they do update both accounts' balances. If the transfer service
      charges a fee, enter it separately: the amount that leaves one account can be more than what arrives in the other.
    </div>`);

  html += section("History", `
    <div class="hint" style="font-size:13px;line-height:1.6;color:#c3c8d1">
      Shows projected income, expenses, transfers, and ending balance by month or year, for one account or everything
      combined, with an optional category filter. Click any row to expand it and see every individual transaction in that
      period.<br/><br/>
      <strong>Export</strong> — "Export summary" downloads the month/year table you're currently viewing as a CSV file;
      "Export all transactions" downloads every individual transaction line for that same view. Both respect whatever
      account and category filter is currently selected — set both to "all" first for a complete, unfiltered export.
      CSV files open directly in Excel, Numbers, or Google Sheets.
    </div>`);

  html += section("What if", `
    <div class="hint" style="font-size:13px;line-height:1.6;color:#c3c8d1">
      <strong>Scenario</strong> — a scratch list for things you're not sure will happen yet (a friend paying you back,
      a possible bill). Add several items and see their combined effect without touching your real numbers.<br/><br/>
      <strong>Overdraft check</strong> — scans the next 12 months and flags the first date any account would go below zero.<br/><br/>
      <strong>When could I afford something?</strong> — enter an amount and it calculates the earliest date you'd
      actually have that much available, based on your real schedule (optionally including the scenario items too).
    </div>`);

  html += section("Backing up your data", `
    <div class="hint" style="font-size:13px;line-height:1.6;color:#c3c8d1">
      Everything lives only in this browser, on this device. In the <strong>Accounts</strong> tab, use
      <strong>Export data</strong> to save a backup file, and <strong>Import data</strong> to restore it or move to a
      new computer. It's worth exporting a backup periodically, and definitely before clearing your browser data or
      switching browsers/computers.
    </div>`);

  html += `</div>`;
  return html;
}

document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    let parsed;
    try {
      parsed = JSON.parse(ev.target.result);
    } catch (err) {
      alert("Couldn't read that file. Make sure it's a My Monies backup .json file.");
      e.target.value = "";
      return;
    }
    if (parsed && parsed.myMoniesEncrypted) {
      const password = prompt("This backup is password-protected. Enter the password:");
      if (!password) { e.target.value = ""; return; }
      try {
        const decrypted = await decryptBackup(parsed, password);
        if (decrypted && decrypted.accounts) {
          migrate(decrypted);
          data = decrypted;
          saveData(); render();
          alert("Import successful.");
        } else {
          alert("That decrypted, but doesn't look like a My Monies backup.");
        }
      } catch (decErr) {
        alert("Couldn't decrypt that file — wrong password, or the file is corrupted.");
      }
      e.target.value = "";
      return;
    }
    if (parsed && parsed.accounts) {
      migrate(parsed);
      data = parsed;
      saveData(); render();
      alert("Import successful.");
    } else {
      alert("That file doesn't look like a My Monies backup.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ---------- text size / zoom ----------
let uiZoom = parseFloat(localStorage.getItem("ledger-zoom")) || 1;
function applyZoom() {
  document.body.style.zoom = uiZoom;
  document.getElementById("zoomLabel").textContent = Math.round(uiZoom * 100) + "%";
}
document.getElementById("zoomOutBtn").onclick = () => {
  uiZoom = Math.max(0.75, +(uiZoom - 0.1).toFixed(2));
  localStorage.setItem("ledger-zoom", uiZoom);
  applyZoom();
};
document.getElementById("zoomInBtn").onclick = () => {
  uiZoom = Math.min(1.75, +(uiZoom + 0.1).toFixed(2));
  localStorage.setItem("ledger-zoom", uiZoom);
  applyZoom();
};
applyZoom();

render();
</script>
</body>
</html>
